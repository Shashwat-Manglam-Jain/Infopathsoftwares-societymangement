{% extends "base.html" %}
{% block title %}Open Fixed Deposit — InfoSociety{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Open Fixed Deposit</h1>
        <a href="{% url 'deposits:fd_list' %}" class="text-gray-500 hover:text-gray-700 text-sm">&larr; Back</a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <form method="post">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Member</label>
                    <select name="member" required class="w-full rounded-lg border-gray-300 px-3 py-2">
                        <option value="">Select Member</option>
                        {% for m in members %}
                        <option value="{{ m.pk }}">{{ m.member_no }} — {{ m.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">FD Product</label>
                    <select name="product" required class="w-full rounded-lg border-gray-300 px-3 py-2">
                        <option value="">Select Product</option>
                        {% for p in products %}
                        <option value="{{ p.pk }}">{{ p.name }} ({{ p.min_amount }}–{{ p.max_amount }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Deposit Amount (&#8377;)</label>
                    <input type="number" name="amount" step="0.01" min="1" required class="w-full rounded-lg border-gray-300 px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tenure (Days)</label>
                    <input type="number" name="tenure_days" min="1" required class="w-full rounded-lg border-gray-300 px-3 py-2">
                </div>
                <div class="flex items-center gap-4 col-span-full">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" name="is_auto_renew" class="rounded border-gray-300">
                        <span class="text-sm text-gray-700">Auto Renew</span>
                    </label>
                    <label class="flex items-center gap-2">
                        <input type="checkbox" name="is_senior" class="rounded border-gray-300">
                        <span class="text-sm text-gray-700">Senior Citizen Rate</span>
                    </label>
                </div>
            </div>
            <div class="mt-6 flex justify-end">
                <button type="submit" class="bg-primary-600 text-white px-8 py-2 rounded-lg hover:bg-primary-700 font-medium">Create FD</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
