{% load i18n %}
<!-- Toast Container (fixed top-right) -->
<div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none" style="max-width: 420px;"></div>

{% if messages %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    {% for message in messages %}
    window.showToast("{{ message|escapejs }}", "{{ message.tags|default:'info' }}");
    {% endfor %}
});
</script>
{% endif %}
