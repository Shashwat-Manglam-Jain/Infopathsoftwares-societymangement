{% load i18n %}
{% if messages %}
<div class="px-4 sm:px-6 pt-4 space-y-2" x-data>
    {% for message in messages %}
    <div x-data="{ show: true }" x-show="show" x-transition
         class="flex items-center justify-between px-4 py-3 rounded-lg text-sm
                {% if message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200
                {% elif message.tags == 'warning' %}bg-amber-50 text-amber-800 border border-amber-200
                {% elif message.tags == 'success' %}bg-green-50 text-green-800 border border-green-200
                {% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
        <div class="flex items-center space-x-2">
            {% if message.tags == 'error' %}
            <svg class="h-5 w-5 flex-shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {% elif message.tags == 'success' %}
            <svg class="h-5 w-5 flex-shrink-0 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {% else %}
            <svg class="h-5 w-5 flex-shrink-0 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {% endif %}
            <span>{{ message }}</span>
        </div>
        <button @click="show = false" class="ml-4 flex-shrink-0 opacity-60 hover:opacity-100">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
