{% extends "base.html" %}
{% block title %}Add Loan Charge{% endblock %}
{% block page_title %}Add Loan Charge{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-semibold text-gray-900">Add Loan Charge</h1>
        <a href="{% url 'loans:loan_charge_list' %}" class="text-sm text-primary-600 hover:text-primary-800 font-medium">&larr; Back to List</a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Loan Account</label>
                    <select name="loan" required class="searchable w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                        <option value="">-- Select Loan --</option>
                        {% for loan in loans %}
                        <option value="{{ loan.pk }}">{{ loan.loan_no }} — {{ loan.member.name }} (₹{{ loan.outstanding_principal|floatformat:2 }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Charge Type</label>
                    <select name="charge_type" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                        {% for val, label in charge_types %}
                        <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Amount (₹)</label>
                    <input type="number" name="amount" step="0.01" min="0.01" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Narration</label>
                    <input type="text" name="narration" maxlength="300" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                </div>
            </div>
            <div class="pt-2">
                <button type="submit" class="bg-primary-600 text-white px-6 py-2.5 rounded-lg text-sm font-medium hover:bg-primary-700 transition"
                        onclick="return confirm('Add this charge to the loan? This will increase the outstanding principal.')">
                    Add Loan Charge
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
