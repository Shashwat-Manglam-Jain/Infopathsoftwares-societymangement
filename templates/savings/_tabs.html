{% load i18n %}
<div class="border-b border-gray-200 mb-4">
    <nav class="flex space-x-6 -mb-px overflow-x-auto">
        <a href="{% url 'savings:list' %}" class="px-1 pb-3 text-sm font-medium border-b-2 whitespace-nowrap {% if not request.GET.type %}border-primary-600 text-primary-600{% else %}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{% endif %}">{% trans "All Savings" %}</a>
        <a href="{% url 'savings:list' %}?type=current" class="px-1 pb-3 text-sm font-medium border-b-2 whitespace-nowrap {% if request.GET.type == 'current' %}border-primary-600 text-primary-600{% else %}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{% endif %}">{% trans "Current A/c" %}</a>
        <a href="{% url 'savings:list' %}?type=security" class="px-1 pb-3 text-sm font-medium border-b-2 whitespace-nowrap {% if request.GET.type == 'security' %}border-primary-600 text-primary-600{% else %}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{% endif %}">{% trans "Security Deposits" %}</a>
        {% if request.user.is_cashier %}<a href="{% url 'savings:create' %}" class="px-1 pb-3 text-sm font-medium border-b-2 whitespace-nowrap border-transparent text-primary-600 hover:text-primary-700">+ {% trans "New Account" %}</a>{% endif %}
    </nav>
</div>
