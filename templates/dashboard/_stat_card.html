{% load i18n %}
<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-{{ color }}-500 to-{{ color }}-600"></div>
    <div class="flex items-center justify-between">
        <div class="min-w-0">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">{% trans label %}</p>
            <p class="mt-2 text-2xl font-bold text-gray-900 tabular-nums truncate">
                {% if is_currency %}&#8377;{{ value|floatformat:0|default:"0" }}{% else %}{{ value|default:"0" }}{% endif %}
            </p>
        </div>
        <div class="w-11 h-11 bg-{{ color }}-50 rounded-xl flex items-center justify-center shrink-0 ml-3">
            {% if icon == "members" %}
            <svg class="h-5 w-5 text-{{ color }}-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            {% elif icon == "deposits" %}
            <svg class="h-5 w-5 text-{{ color }}-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            {% elif icon == "loans" %}
            <svg class="h-5 w-5 text-{{ color }}-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
            {% elif icon == "shares" %}
            <svg class="h-5 w-5 text-{{ color }}-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
            {% endif %}
        </div>
    </div>
</div>
