{% load i18n %}
<script>
function exportCsvUrl() {
    var params = new URLSearchParams(window.location.search);
    params.set('format', 'csv');
    return '?' + params.toString();
}
</script>
<a onclick="window.location.href=exportCsvUrl(); return false;" href="#" class="inline-flex items-center px-4 py-1.5 border border-gray-300 rounded text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 cursor-pointer no-print">
    <svg class="h-4 w-4 mr-1.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
    {% trans "Export CSV" %}
</a>
