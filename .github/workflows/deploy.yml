name: Deploy to Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/society_software
            git fetch origin main
            git reset --hard origin/main
            source venv/bin/activate
            set -a; source .env; set +a
            pip install -r requirements.txt
            python manage.py migrate_schemas --shared
            python manage.py migrate_schemas --tenant
            python manage.py collectstatic --noinput
            if ! diff -q infrastructure/nginx.conf /etc/nginx/sites-available/society 2>/dev/null; then
              sudo cp infrastructure/nginx.conf /etc/nginx/sites-available/society
              sudo ln -sf /etc/nginx/sites-available/society /etc/nginx/sites-enabled/society
              sudo nginx -t && sudo systemctl reload nginx
            fi
            sudo systemctl restart gunicorn
            sudo systemctl restart celery
            sudo systemctl restart celerybeat
