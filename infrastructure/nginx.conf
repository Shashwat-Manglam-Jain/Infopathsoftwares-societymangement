upstream gunicorn {
    server 127.0.0.1:8000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name infopathsolutions.in *.infopathsolutions.in;
    return 301 https://$host$request_uri;
}

# HTTPS — handles both main domain and all tenant subdomains
server {
    listen 443 ssl;
    server_name infopathsolutions.in *.infopathsolutions.in;

    ssl_certificate /etc/letsencrypt/live/infopathsolutions.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infopathsolutions.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    location /static/ {
        alias /opt/society_software/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /opt/society_software/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://gunicorn;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location /health/ {
        proxy_pass http://gunicorn;
        access_log off;
    }
}
