line-length = 120
target-version = "py312"

[format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "T20",   # flake8-print (catch print statements)
    "RET",   # flake8-return
    "DJ",    # flake8-django
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "RUF012",  # mutable class variable (Django model fields)
    "DJ001",   # null=True on string fields (valid in our models)
    "SIM108",  # ternary operator (readability preference)
    "RET504",  # unnecessary assignment before return
    "RUF002",  # ambiguous unicode in docstrings (₹ symbol is intentional)
    "RUF003",  # ambiguous unicode in comments (₹ symbol is intentional)
    "RUF005",  # iterable unpacking vs concatenation (Django admin patterns)
    "B905",    # zip strict parameter (not needed for paired iteration)
    "SIM102",  # collapsible if (readability preference)
    "SIM105",  # contextlib.suppress (explicit try/except is clearer)
]

[lint.isort]
known-first-party = ["apps", "config"]

[lint.per-file-ignores]
"*/migrations/*.py" = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "T20", "RET", "DJ", "C4", "PIE", "RUF"]
"tests/*.py" = ["B", "SIM", "RET", "E741", "F841"]
"config/settings/*.py" = ["F405"]
"manage.py" = ["T20"]
